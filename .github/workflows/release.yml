name: Build signed beta APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
      - '!v*-debug'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  signed-beta:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: beta-signing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6
      - name: Require protected signing secrets
        env:
          BETA_KEYSTORE_BASE64: ${{ secrets.BETA_KEYSTORE_BASE64 }}
          BETA_KEYSTORE_PASSWORD: ${{ secrets.BETA_KEYSTORE_PASSWORD }}
          BETA_KEY_ALIAS: ${{ secrets.BETA_KEY_ALIAS }}
          BETA_KEY_PASSWORD: ${{ secrets.BETA_KEY_PASSWORD }}
          BETA_SIGNING_CERT_SHA256: ${{ vars.BETA_SIGNING_CERT_SHA256 }}
        run: |
          test -n "$BETA_KEYSTORE_BASE64"
          test -n "$BETA_KEYSTORE_PASSWORD"
          test -n "$BETA_KEY_ALIAS"
          test -n "$BETA_KEY_PASSWORD"
          test -n "$BETA_SIGNING_CERT_SHA256"
      - name: Install SDK packages
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0"'
      - name: Materialize ephemeral signing keystore
        env:
          BETA_KEYSTORE_BASE64: ${{ secrets.BETA_KEYSTORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$BETA_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/car-call-router-beta.jks"
      - name: Test and build signed APK
        env:
          BETA_KEYSTORE_FILE: ${{ runner.temp }}/car-call-router-beta.jks
          BETA_KEYSTORE_PASSWORD: ${{ secrets.BETA_KEYSTORE_PASSWORD }}
          BETA_KEY_ALIAS: ${{ secrets.BETA_KEY_ALIAS }}
          BETA_KEY_PASSWORD: ${{ secrets.BETA_KEY_PASSWORD }}
        run: >-
          bash gradlew
          -PENABLE_BETA_SIGNING=true
          :core:check
          :app:ktlintCheck
          :app:testDebugUnitTest
          :verification:service-tests:check
          :verification:bluetooth-tests:check
          :verification:call-safety-tests:check
          :app:lintRelease
          :app:assembleRelease
          --stacktrace --console=plain
      - name: Verify signed APK identity
        env:
          REPORT_FILE: verification/current/apk-release-verification.txt
          EXPECTED_CERT_SHA256: ${{ vars.BETA_SIGNING_CERT_SHA256 }}
        run: >-
          bash tools/verify-apk.sh
          app/build/outputs/apk/release/app-release.apk
          org.carcallrouter.companion 18 0.3.0-beta.16 34 36 false
      - name: Compute APK digest
        run: sha256sum app/build/outputs/apk/release/app-release.apk > app-release.apk.sha256
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: android-auto-call-switcher-signed-beta
          path: |
            app/build/outputs/apk/release/app-release.apk
            app-release.apk.sha256
            verification/current/apk-release-verification.txt
          if-no-files-found: error
          retention-days: 30
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          app/build/outputs/apk/release/app-release.apk
          app-release.apk.sha256
          verification/current/apk-release-verification.txt
          --verify-tag --generate-notes
      - name: Remove ephemeral keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/car-call-router-beta.jks"
