name: Build and test Android source

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, edited]
  merge_group:
    branches: [main]

concurrency:
  group: build-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

permissions:
  contents: read

env:
  BASE_VERSION_CODE: '16'
  BASE_VERSION_NAME: 0.3.0-beta.14

jobs:
  host-contract:
    name: Host contracts (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6
      - name: Test policy, service callback, trace, and capture contracts
        run: |
          python3 -m unittest tools.tests.test_analyze_device_trace tools.tests.test_analyze_parked_reports tools.tests.test_capture_device_run tools.tests.test_extract_new_app_events
          bash gradlew :core:test :verification:service-tests:test :verification:bluetooth-tests:test --stacktrace --console=plain

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      # Pinned immutable revisions; update only through a reviewed dependency change.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6
      - name: Install SDK packages
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"'
      - name: Test host tooling
        run: |
          python3 tools/check_version_consistency.py
          python3 -m unittest discover -s tools/tests -p 'test_*.py'
          bash -n tools/*.sh verification/service-tests/run.sh
          pwsh -NoProfile -Command '$errors = $null; [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path "tools/install.ps1"), [ref]$null, [ref]$errors) > $null; if ($errors.Count) { $errors | Out-String | Write-Error; exit 1 }'
      - name: Compile, unit-test, service-test and lint
        run: bash gradlew :core:check :app:ktlintCheck :app:assembleDebug :app:testDebugUnitTest :verification:service-tests:check :verification:bluetooth-tests:check :app:lintDebug --stacktrace --console=plain
      - name: Publish coverage summary
        run: >-
          python3 tools/summarize_coverage.py
          --report core=core/build/reports/jacoco/test/jacocoTestReport.xml
          --report service=verification/service-tests/build/reports/jacoco/test/jacocoTestReport.xml
          --report bluetooth=verification/bluetooth-tests/build/reports/jacoco/test/jacocoTestReport.xml
          --output "$GITHUB_STEP_SUMMARY"
      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: test-and-coverage-reports
          path: |
            core/build/reports/jacoco/test/
            core/build/test-results/test/
            verification/service-tests/build/reports/jacoco/test/
            verification/service-tests/build/test-results/test/
            verification/bluetooth-tests/build/reports/jacoco/test/
            verification/bluetooth-tests/build/test-results/test/
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 14
      - name: Verify APK signature and manifest identity
        env:
          REPORT_FILE: verification/current/apk-verification.txt
        run: bash tools/verify-apk.sh app/build/outputs/apk/debug/app-debug.apk org.carcallrouter.companion 16 0.3.0-beta.14 34 36 true
      - name: Upload debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-auto-call-switcher-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            verification/current/apk-verification.txt
          if-no-files-found: error
          retention-days: 14
      - name: Verify custom debug signing contract
        env:
          BETA_KEYSTORE_FILE: ${{ runner.temp }}/ci-debug-signing.p12
          BETA_KEYSTORE_PASSWORD: ci-only-test-password
          BETA_KEY_ALIAS: ci-debug
          BETA_KEY_PASSWORD: ci-only-test-password
        run: |
          trap 'rm -f "$BETA_KEYSTORE_FILE"' EXIT
          keytool -genkeypair -noprompt -storetype PKCS12 \
            -keystore "$BETA_KEYSTORE_FILE" -storepass "$BETA_KEYSTORE_PASSWORD" \
            -keypass "$BETA_KEY_PASSWORD" -alias "$BETA_KEY_ALIAS" \
            -keyalg RSA -keysize 2048 -validity 1 \
            -dname "CN=CI Debug Signing Test"
          expected_cert="$(LC_ALL=C keytool -list -v -keystore "$BETA_KEYSTORE_FILE" \
            -storepass "$BETA_KEYSTORE_PASSWORD" -alias "$BETA_KEY_ALIAS" \
            | sed -n 's/^[[:space:]]*SHA256:[[:space:]]*//p' | head -n 1)"
          bash gradlew :app:assembleDebug -PENABLE_BETA_SIGNING=true \
            -PAPP_VERSION_NAME=0.3.0-beta.14.ci --stacktrace --console=plain
          EXPECTED_CERT_SHA256="$expected_cert" bash tools/verify-apk.sh \
            app/build/outputs/apk/debug/app-debug.apk \
            org.carcallrouter.companion 16 0.3.0-beta.14.ci 34 36 true

  publish-debug:
    name: Publish verified debug beta
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [host-contract, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: debug-signing
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Require protected debug signing secrets
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
          DEBUG_KEYSTORE_PASSWORD: ${{ secrets.DEBUG_KEYSTORE_PASSWORD }}
          DEBUG_KEY_ALIAS: ${{ secrets.DEBUG_KEY_ALIAS }}
          DEBUG_KEY_PASSWORD: ${{ secrets.DEBUG_KEY_PASSWORD }}
          DEBUG_SIGNING_CERT_SHA256: ${{ vars.DEBUG_SIGNING_CERT_SHA256 }}
        run: |
          for name in DEBUG_KEYSTORE_BASE64 DEBUG_KEYSTORE_PASSWORD DEBUG_KEY_ALIAS DEBUG_KEY_PASSWORD DEBUG_SIGNING_CERT_SHA256; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Configure $name in the debug-signing environment before publishing APKs."
              exit 1
            fi
          done
      - name: Install SDK packages
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"'
      - name: Identify this source build
        run: |
          short_sha="${GITHUB_SHA:0:12}"
          echo "VERSION_CODE=$((100000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "VERSION_NAME=${BASE_VERSION_NAME}.${short_sha}" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=v${BASE_VERSION_NAME}-debug.${short_sha}" >> "$GITHUB_ENV"
          echo "APK_NAME=android-auto-call-switcher-${BASE_VERSION_NAME}-debug.${short_sha}.apk" >> "$GITHUB_ENV"
      - name: Materialize temporary signing keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/car-call-router-debug.jks"
      - name: Build signed debug beta
        env:
          BETA_KEYSTORE_FILE: ${{ runner.temp }}/car-call-router-debug.jks
          BETA_KEYSTORE_PASSWORD: ${{ secrets.DEBUG_KEYSTORE_PASSWORD }}
          BETA_KEY_ALIAS: ${{ secrets.DEBUG_KEY_ALIAS }}
          BETA_KEY_PASSWORD: ${{ secrets.DEBUG_KEY_PASSWORD }}
        run: >-
          bash gradlew :app:assembleDebug
          -PENABLE_BETA_SIGNING=true
          -PAPP_VERSION_CODE="$VERSION_CODE"
          -PAPP_VERSION_NAME="$VERSION_NAME"
          --stacktrace --console=plain
      - name: Verify APK identity
        env:
          REPORT_FILE: dist/apk-verification.txt
          EXPECTED_CERT_SHA256: ${{ vars.DEBUG_SIGNING_CERT_SHA256 }}
        run: >-
          bash tools/verify-apk.sh
          app/build/outputs/apk/debug/app-debug.apk
          org.carcallrouter.companion
          "$VERSION_CODE"
          "$VERSION_NAME"
          34 36 true
      - name: Prepare direct-download assets
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "dist/$APK_NAME"
          (cd dist && sha256sum "$APK_NAME" > "$APK_NAME.sha256")
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/${{ env.APK_NAME }}
      - name: Publish GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            mapfile -t existing < <(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')
            for asset in "$APK_NAME" "$APK_NAME.sha256" apk-verification.txt; do
              if ! printf '%s\n' "${existing[@]}" | grep -Fxq "$asset"; then
                gh release upload "$RELEASE_TAG" "dist/$asset"
              fi
            done
          else
            gh release create "$RELEASE_TAG" \
              "dist/$APK_NAME" \
              "dist/$APK_NAME.sha256" \
              dist/apk-verification.txt \
              --target "$GITHUB_SHA" \
              --prerelease \
              --title "Android Auto Call Switcher $VERSION_NAME (debug beta)" \
              --notes-file docs/DEBUG-PRERELEASE-NOTES.md
          fi
          printf '[Download verified APK](https://github.com/%s/releases/download/%s/%s)\n' \
            "$GITHUB_REPOSITORY" "$RELEASE_TAG" "$APK_NAME" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove temporary signing keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/car-call-router-debug.jks"
